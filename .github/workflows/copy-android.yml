name: Copy Android validation

on:
  push:
    branches:
      - copy/foundation-requirements
    paths:
      - "android/**"
      - ".github/workflows/copy-android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/copy-android.yml"
  workflow_dispatch:

# Keep only the newest validation for a branch/PR; stale emulator jobs waste runner time.
concurrency:
  group: copy-android-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compile and run available unit tests
        run: gradle -p android --no-daemon assembleDebug testDebugUnitTest

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle -p android --no-daemon connectedDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: copy-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
